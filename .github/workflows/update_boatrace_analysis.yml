name: Update BOAT RACE analysis

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD"
        required: false
        default: "2026-04-01"
      end_date:
        description: "End date YYYY-MM-DD, today, or yesterday"
        required: false
        default: "yesterday"
      threshold:
        description: "Trifecta payout threshold"
        required: false
        default: "5100"
      refresh_recent_days:
        description: "Refetch and overwrite recent N days to catch corrected data"
        required: false
        default: "14"
      force_refresh_all:
        description: "true = refetch all cached days and overwrite if changed"
        required: false
        default: "false"

  schedule:
    # Daily: 05:07 JST. GitHub cron is UTC, so 20:07 UTC = 05:07 JST.
    - cron: "7 20 * * *"
    # Weekly full refresh: Sunday 05:37 JST = Saturday 20:37 UTC.
    - cron: "37 20 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run analysis
        run: |
          START_DATE="${{ github.event.inputs.start_date || '2026-04-01' }}"
          END_DATE="${{ github.event.inputs.end_date || 'yesterday' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '5100' }}"
          REFRESH_RECENT_DAYS="${{ github.event.inputs.refresh_recent_days || '14' }}"
          FORCE_REFRESH_ALL="${{ github.event.inputs.force_refresh_all || 'false' }}"

          # Weekly schedule refetches all days to catch old corrected data.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "37 20 * * 6" ]; then
            FORCE_REFRESH_ALL="true"
          fi

          EXTRA_ARGS=""
          if [ "$FORCE_REFRESH_ALL" = "true" ]; then
            EXTRA_ARGS="--force-refresh-all"
          fi

          python boatrace_analysis.py             --start-date "$START_DATE"             --end-date "$END_DATE"             --threshold "$THRESHOLD"             --refresh-recent-days "$REFRESH_RECENT_DAYS"             $EXTRA_ARGS

      - name: Commit updated outputs and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output cache_json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update boatrace analysis outputs and cache"
            git push
          fi
